name: mda-bank-pilot-prod
services:
  frontend:
    build:
      context: ../frontend
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
    environment:
      - VITE_API_HOST=http://192.168.88.22:7092
      - VITE_API_STREAMING=true
    ports:
      - "5173:5173"
    depends_on:
      - backend

  payment-control-poc:
    build:
      context: ../payment-control-poc
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
    environment:
      - VITE_API_HOST=http://192.168.88.22:7092
      - VITE_AGENT_TYPE=payment_validator_pipeline
      - VITE_API_STREAMING=true
    ports:
      - "5174:5173"
    depends_on:
      - backend

  backend:
    user: root
    build:
      context: ../application
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - TORCH_INDEX_URL=${TORCH_INDEX_URL:-}
        - ONNXRUNTIME_PACKAGE=${ONNXRUNTIME_PACKAGE:-onnxruntime}
    environment:
      - API_KEY=xx
      - OPENAI_API_KEY=xx
      - EMBEDDINGS_KEY=xxx
      - EMBEDDINGS_BASE_URL=
      - LLM_PROVIDER=openai
      - LLM_NAME=/model
      - OPENAI_BASE_URL=https://qwen3-ml.bveb.by/v1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - MONGO_URI=mongodb://mongo:27017/docsgpt
      - CACHE_REDIS_URL=redis://redis:6379/2
      - INTERNAL_KEY=dev-internal-key-change-me
      - TIKTOKEN_CACHE_DIR=/app/application/.tiktoken_cache
      - DOCLING_DEVICE=cpu
      - DOCLING_OCR_USE_RAPIDOCR=true
      - DOCLING_RAPIDOCR_BACKEND=onnxruntime
      - DOCLING_RAPIDOCR_PARAMS={"EngineConfig.onnxruntime.use_cuda":true,"EngineConfig.onnxruntime.cuda_ep_cfg.device_id":0}
      - DOCLING_RAPIDOCR_DET_MODEL_PATH=/app/application/models/rapidocr/detection/v5/det.onnx
      - DOCLING_RAPIDOCR_REC_MODEL_PATH=/app/application/models/rapidocr/languages/eslav/rec.onnx
      - DOCLING_RAPIDOCR_CLS_MODEL_PATH=/app/application/models/rapidocr/cls/ch_ppocr_mobile_v2.0_cls_infer.onnx
      - DOCLING_RAPIDOCR_REC_KEYS_PATH=/app/application/models/rapidocr/languages/eslav/dict.txt
      - DOCLING_OCR_LANGUAGES=["ru","en"]
      - DOCLING_ARTIFACTS_PATH=/app/application/models/docling
      - DOCLING_PDF_THREADED_PIPELINE_ENABLED=false
      - DOCLING_PDF_LAYOUT_BATCH_SIZE=4
      - DOCLING_PDF_OCR_BATCH_SIZE=4
      - DOCLING_PDF_TABLE_BATCH_SIZE=4
      - DOCLING_PDF_BATCH_POLLING_INTERVAL_SECONDS=0.5
      - DOCLING_PDF_QUEUE_MAX_SIZE=100
      - DOCLING_PDF_PAGE_BATCH_SIZE=4
      - LLM_CONTEXT_TOKENS=4000
    ports:
      - "7091:7091"
    volumes:
      - ../application/indexes:/app/indexes
      - ../application/inputs:/app/inputs
      - ../application/vectors:/app/vectors
    depends_on:
      - redis
      - mongo

  nginx:
    image: nginx:1.27.4-alpine
    ports:
      - "7092:7091"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  worker-orchestrator:
    user: root
    build:
      context: ../application
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - TORCH_INDEX_URL=${TORCH_INDEX_URL:-}
        - ONNXRUNTIME_PACKAGE=${ONNXRUNTIME_PACKAGE:-onnxruntime}
    command: celery -A application.app.celery worker -l INFO -B --pool=threads -c 16 -Q default -n orchestrator@%h
    environment:
      - API_KEY=xx
      - OPENAI_API_KEY=xx
      - EMBEDDINGS_KEY=xxx
      - EMBEDDINGS_BASE_URL=
      - LLM_PROVIDER=openai
      - LLM_NAME=/model
      - OPENAI_BASE_URL=https://qwen3-ml.bveb.by/v1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - MONGO_URI=mongodb://mongo:27017/docsgpt
      - API_URL=http://backend:7091
      - CACHE_REDIS_URL=redis://redis:6379/2
      - INTERNAL_KEY=dev-internal-key-change-me
      - TIKTOKEN_CACHE_DIR=/app/application/.tiktoken_cache
      - DOCLING_DEVICE=cpu
      - DOCLING_OCR_USE_RAPIDOCR=true
      - DOCLING_OCR_LANGUAGES=["ru","en"]
      - DOCLING_ARTIFACTS_PATH=/app/application/models/docling
      - DOCLING_PDF_THREADED_PIPELINE_ENABLED=false
      - DOCLING_PDF_LAYOUT_BATCH_SIZE=4
      - DOCLING_PDF_OCR_BATCH_SIZE=4
      - DOCLING_PDF_TABLE_BATCH_SIZE=4
      - DOCLING_PDF_BATCH_POLLING_INTERVAL_SECONDS=0.5
      - DOCLING_PDF_QUEUE_MAX_SIZE=100
      - DOCLING_PDF_PAGE_BATCH_SIZE=4
      - LLM_CONTEXT_TOKENS=15000
      - COMPRESSOR_MAPREDUCE_ENABLED=True
      - COMPRESSOR_RECOVERY_MAX_DEPTH=1
      - COMPRESSOR_MAX_OUTPUT_TOKENS=9000
      - COMPRESSOR_OUTPUT_RESERVE_TOKENS=9000
      - COMPRESSOR_REDUCE_STRATEGY=deterministic
    volumes:
      - ../application/indexes:/app/indexes
      - ../application/inputs:/app/inputs
      - ../application/vectors:/app/vectors
    depends_on:
      - redis
      - mongo

  worker-ocr:
    user: root
    build:
      context: ../application
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - TORCH_INDEX_URL=${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu128}
        - ONNXRUNTIME_PACKAGE=${ONNXRUNTIME_PACKAGE:-onnxruntime-gpu}
    command: celery -A application.app.celery worker -l INFO -c 2 -Q ocr -n ocr@%h --without-gossip --without-mingle
    environment:
      - API_KEY=xx
      - OPENAI_API_KEY=xx
      - EMBEDDINGS_KEY=xxx
      - EMBEDDINGS_BASE_URL=
      - LLM_PROVIDER=openai
      - LLM_NAME=/model
      - OPENAI_BASE_URL=https://qwen3-ml.bveb.by/v1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - MONGO_URI=mongodb://mongo:27017/docsgpt
      - API_URL=http://backend:7091
      - CACHE_REDIS_URL=redis://redis:6379/2
      - INTERNAL_KEY=dev-internal-key-change-me
      - TIKTOKEN_CACHE_DIR=/app/application/.tiktoken_cache
      - DOCLING_DEVICE=cuda
      - DOCLING_OCR_USE_RAPIDOCR=true
      - DOCLING_RAPIDOCR_BACKEND=onnxruntime
      - DOCLING_RAPIDOCR_PARAMS={"EngineConfig.onnxruntime.use_cuda":true,"EngineConfig.onnxruntime.cuda_ep_cfg.device_id":0,"EngineConfig.onnxruntime.cuda_ep_cfg.arena_extend_strategy":"kSameAsRequested","EngineConfig.onnxruntime.cuda_ep_cfg.cudnn_conv_algo_search":"HEURISTIC","EngineConfig.onnxruntime.cuda_ep_cfg.cudnn_conv_use_max_workspace":"0"}
      - DOCLING_RAPIDOCR_CUDA_GPU_MEM_LIMIT_MB=12288
      - DOCLING_RAPIDOCR_REC_BATCH_NUM=1
      - CELERY_WORKER_MAX_TASKS_PER_CHILD=50
      - DOCLING_EXIT_ON_ORT_OOM=true
      - DOCLING_RAPIDOCR_DET_MODEL_PATH=/app/application/models/rapidocr/detection/v5/det.onnx
      - DOCLING_RAPIDOCR_REC_MODEL_PATH=/app/application/models/rapidocr/languages/eslav/rec.onnx
      - DOCLING_RAPIDOCR_CLS_MODEL_PATH=/app/application/models/rapidocr/cls/ch_ppocr_mobile_v2.0_cls_infer.onnx
      - DOCLING_RAPIDOCR_REC_KEYS_PATH=/app/application/models/rapidocr/languages/eslav/dict.txt
      - DOCLING_OCR_LANGUAGES=["ru","en"]
      - DOCLING_ARTIFACTS_PATH=/app/application/models/docling
      - DOCLING_PDF_THREADED_PIPELINE_ENABLED=false
      - DOCLING_PDF_LAYOUT_BATCH_SIZE=4
      - DOCLING_PDF_OCR_BATCH_SIZE=4
      - DOCLING_PDF_TABLE_BATCH_SIZE=4
      - DOCLING_PDF_BATCH_POLLING_INTERVAL_SECONDS=0.5
      - DOCLING_PDF_QUEUE_MAX_SIZE=100
      - DOCLING_PDF_PAGE_BATCH_SIZE=4
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - LLM_CONTEXT_TOKENS=15000 
      - COMPRESSOR_MAPREDUCE_ENABLED=True
      - COMPRESSOR_RECOVERY_MAX_DEPTH=1   
      - COMPRESSOR_MAX_OUTPUT_TOKENS=9000
      - COMPRESSOR_OUTPUT_RESERVE_TOKENS=9000
      - COMPRESSOR_REDUCE_STRATEGY=deterministic
      # expandable_segments:True triggers cudaMallocAsync which is not
      # supported on NVIDIA vGPU profiles (e.g. GRID V100D-32Q). Newer
      # transformers' caching_allocator_warmup hits this during HF model load
      # and crashes with "CUDA driver error: operation not supported".
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:256
      # Expose CUDA/cuDNN libs that torch's pip wheel installs into the venv so
      # onnxruntime-gpu's CUDAExecutionProvider can dlopen libcublasLt.so.12 /
      # libcudnn.so.9 at session creation. Without this ORT silently falls back
      # to CPU even though the EP shows up in get_available_providers().
      - LD_LIBRARY_PATH=/venv/lib/python3.12/site-packages/nvidia/cublas/lib:/venv/lib/python3.12/site-packages/nvidia/cudnn/lib:/venv/lib/python3.12/site-packages/nvidia/cuda_runtime/lib:/venv/lib/python3.12/site-packages/nvidia/cuda_nvrtc/lib:/venv/lib/python3.12/site-packages/nvidia/curand/lib:/venv/lib/python3.12/site-packages/nvidia/cufft/lib:/venv/lib/python3.12/site-packages/nvidia/nvjitlink/lib
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ../application/indexes:/app/indexes
      - ../application/inputs:/app/inputs
      - ../application/vectors:/app/vectors
    depends_on:
      - redis
      - mongo

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_container:/data/db

volumes:
  mongodb_data_container:
